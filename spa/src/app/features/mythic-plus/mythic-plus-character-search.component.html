<label class="search-field">
  <span class="visually-hidden">Find a character</span>
  <svg class="search-icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
    <circle cx="6.75" cy="6.75" r="4.75" />
    <path d="m10.25 10.25 4 4" />
  </svg>
  <input
    #searchInput
    type="search"
    placeholder="Find a character…"
    enterkeyhint="search"
    autocomplete="off"
    spellcheck="false"
    [value]="query()"
    (input)="onInput($event)"
    (keydown.enter)="openFirst()"
    (keydown.escape)="clear()" />
</label>
@if (open() && suggestions().length) {
  <ol class="suggestions" aria-label="Matching characters" (mousedown)="$event.preventDefault()">
    @for (suggestion of suggestions(); track suggestion.key) {
      <li>
        <a [routerLink]="suggestion.member.profileLink" (click)="picked()">
          <img [src]="suggestion.member.classIcon" [alt]="suggestion.member.className" />
          <span class="suggestion-name" [style.color]="suggestion.member.color">{{ suggestion.member.name }}</span>
          <span class="suggestion-realm">{{ suggestion.member.realm }}</span>
          <span class="suggestion-score">{{ suggestion.score | number:'1.1-1' }}</span>
        </a>
      </li>
    }
  </ol>
}
@if (open() && noMatch()) {
  <p class="suggestions search-empty" role="status">No player by that name.</p>
}
