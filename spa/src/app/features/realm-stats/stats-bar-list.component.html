<ol class="bar-list" [class.ranked]="ranked()" [attr.aria-label]="label()" appReveal>
  @for (row of rows(); track row.key; let index = $index) {
    <li [style.--i]="index">
      @if (row.rank !== undefined) {
        <span class="rank">{{ row.rank }}</span>
      }
      <span class="name">
        @for (icon of row.icons; track icon) {
          <img [src]="icon" alt="" width="18" height="18" loading="lazy" />
        }
        <span class="label">@if (row.prefix) { {{ row.prefix }} }<span [style.color]="row.color">{{ row.label }}</span></span>
        @if (row.note) {
          <span class="note">{{ row.note }}</span>
        }
      </span>
      <span class="value">{{ row.value }}@if (row.detail) {<small>{{ row.detail }}</small>}</span>
      <span class="track" aria-hidden="true">
        <span class="bar" [style.width.%]="row.percent" [style.background]="row.barColor"></span>
      </span>
    </li>
  }
</ol>
